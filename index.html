
<!DOCTYPE html>
<html>
<head>
<title>FF Unban Service</title>
<style>
body { font-family: Arial; text-align: center; background:#111; color:#fff; }
input, button { padding:10px; margin:10px; }
</style>
</head>

<body>

<h1>Free Fire Unban Request</h1>

<input type="text" id="uid" placeholder="Enter UID">
<br>
<button onclick="nextPage()">Submit</button>

<script>
function nextPage(){
    let uid = document.getElementById("uid").value;
    if(uid==""){
        alert("Enter UID");
        return;
    }
    localStorage.setItem("uid", uid);
    window.location.href="page2.html";
}
</script>

</body>
</html>
