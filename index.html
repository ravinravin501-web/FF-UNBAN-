<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Unban Request</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Card */
.container {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 20px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    text-align: center;
}

/* Heading */
.container h1 {
    color: #00c6ff;
    margin-bottom: 25px;
    font-size: 24px;
}

/* Input fields */
.input-box {
    width: 100%;
    margin-bottom: 20px;
}

.input-box select,
.input-box input {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 14px;
    background: rgba(255,255,255,0.15);
    color: white;
}

/* Dropdown text color fix */
.input-box select option {
    color: black;
}

/* Button */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00c6ff, #0072ff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px #00c6ff;
}

/* Footer small text */
.footer {
    margin-top: 15px;
    font-size: 12px;
    color: #ccc;
}
</style>

</head>

<body>

<div class="container">
    <h1>FF Unban Request</h1>

    <form>
        <div class="input-box">
            <select required>
                <option value="">Select Region</option>
                <option>India</option>
                <option>Singapore</option>
                <option>Brazil</option>
                <option>Indonesia</option>
                <option>Europe</option>
            </select>
        </div>

        <div class="input-box">
            <input type="text" placeholder="Enter UID" required>
        </div>

        <button type="submit">Submit</button>
    </form>

    <div class="footer">
        Official Request Portal
    </div>
</div>

</body>
</html>
