<!DOCTYPE html>
<html>
<head>
<title>Payment</title>

<style>
body {
    margin:0;
    font-family: Arial;
    color:white;
    text-align:center;

    /* Free Fire Background */
    background: url('https://wallpapercave.com/wp/wp7418474.jpg') no-repeat center center/cover;
}

/* Dark overlay for readability */
.overlay {
    background: rgba(0,0,0,0.7);
    min-height:100vh;
    padding:20px;
}

/* Garena Logo */
.logo {
    width:80px;
    position:absolute;
    top:10px;
    left:10px;
}

/* Box */
.box {
    border:1px solid #555;
    padding:20px;
    margin:20px auto;
    width:90%;
    max-width:400px;
    background:rgba(0,0,0,0.6);
    border-radius:10px;
}

/* Button */
button {
    padding:12px 20px;
    background:green;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="overlay">

<!-- Garena Logo -->
<img src="https://upload.wikimedia.org/wikipedia/en/7/77/Garena_logo.png" class="logo">

<h2>Player Details</h2>

<div class="box">
<p>UID: <span id="uid"></span></p>
<p>Name: *******</p>
<p>Level: *******</p>
<p>Rank: *****</p>
</div>

<h2>Pay Now</h2>

<div class="box">
<img src="gpay.png" width="200"><br><br>

<a href="upi://pay?pa=yourupi@okaxis&pn=Ravin&am=50&cu=INR">
    <button>Pay Now (GPay / PhonePe)</button>
</a>

<p id="timer">05:00</p>
</div>

<input type="file" id="proof"><br><br>

<button onclick="submitProof()">Submit Payment</button>

<p id="status"></p>

</div>

<script>
document.getElementById("uid").innerText = localStorage.getItem("uid");

// Timer
let time = 300;
let timer = setInterval(()=>{
    let min = Math.floor(time/60);
    let sec = time%60;
    document.getElementById("timer").innerText =
        (min<10?"0":"")+min+":"+(sec<10?"0":"")+sec;

    time--;
    if(time<0){
        clearInterval(timer);
        document.getElementById("timer").innerText = "EXPIRED";
    }
},1000);

// Submit
function submitProof(){
    let file = document.getElementById("proof").files.length;
    if(file==0){
        alert("Upload payment screenshot");
        return;
    }

    document.getElementById("status").innerText =
        "Payment Submitted! Waiting for verification...";
}
</script>

</body>
</html>
