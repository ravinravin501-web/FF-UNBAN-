<<d     <!DOCTYPE html>
<html>
<head>
<title>Payment</title>

<style>
body { font-family: Arial; text-align:center; background:#000; color:#fff; }
.box { border:1px solid #444; padding:20px; margin:20px; }
button { padding:10px 20px; }
</style>

</head>

<body>

<h2>Player Details</h2>

<div class="box">
<p>UID: <span id="uid"></span></p>
<p>Name: ******</p>
<p>Level: ******</p>
<p>Rank: *****</p>
</div>

<h2>Pay Now</h2>

<div class="box">
<img src="your-qr.png" width="200"><br><br>
<p>Scan & Pay via UPI</p>
<p id="timer">05:00</p>
</div>

<input type="file" id="proof"><br><br>

<button onclick="submitProof()">Submit Payment</button>

<p id="status"></p>

<script>
document.getElementById("uid").innerText = localStorage.getItem("uid");

// Timer
let time = 300;
let timer = setInterval(()=>{
    let min = Math.floor(time/60);
    let sec = time%60;
    document.getElementById("timer").innerText =
        (min<10?"0":"")+min+":"+(sec<10?"0":"")+sec;

    time--;
    if(time<0){
        clearInterval(timer);
        document.getElementById("timer").innerText = "EXPIRED";
    }
},1000);

// Submit
function submitProof(){
    let file = document.getElementById("proof").files.length;
    if(file==0){
        alert("Upload payment screenshot");
        return;
    }

    document.getElementById("status").innerText =
        "Payment Submitted! Waiting for verification...";
}
</script>

</body>
</html>                                        </html>
